<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Álbuns da Copa - Coleção de Figurinhas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F172A">
  <link rel="stylesheet" href="style.css?v=21.0">
</head>
<body>
  <div id="app">
    
    <!-- ========================================== -->
    <!-- TELA 1: MENU PRINCIPAL DE ÁLBUNS (HOME)   -->
    <!-- ========================================== -->
    <div id="screen-home" class="app-screen active">
      <header class="app-header">
        <div class="brand">
          <span class="brand-icon">🏆</span>
          <h1 class="brand-title">Meus Álbuns da Copa</h1>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="btnBackupRestore" title="Backup & Restauração de Dados">💾</button>
        </div>
      </header>

      <main class="home-main">
        <p class="home-subtitle">Selecione um álbum para ver as seleções e figurinhas:</p>
        <div class="album-cards-list" id="homeAlbumList">
          <!-- Renderizado via JS -->
        </div>
      </main>
    </div>

    <!-- ========================================== -->
    <!-- TELA 2: ÁLBUM COM SEÇÕES EXPANSÍVEIS     -->
    <!-- ========================================== -->
    <div id="screen-album" class="app-screen">
      <header class="album-header">
        <button class="btn-back" id="btnBackToHome">← Voltar aos Álbuns</button>
        <h2 class="active-album-title" id="activeAlbumTitle">Álbum</h2>
        <div class="header-actions">
          <button class="btn-icon" id="btnExportMissing" title="Exportar Figurinhas Faltantes / Repetidas">📤</button>
          <button class="btn-icon" id="btnAddCustom" title="Adicionar / Editar Player">+</button>
        </div>
      </header>

      <!-- Progresso Geral do Álbum -->
      <div class="album-hero" id="albumHero">
        <!-- Renderizado via JS -->
      </div>

      <!-- Barra de Pesquisa e Filtros -->
      <div class="toolbar">
        <div class="dup-mode-bar">
          <button class="btn-dup-mode" id="btnToggleDuplicatesMode">
            <span class="dup-mode-icon">🔁</span>
            <span class="dup-mode-label">Modo Edição de Repetidas:</span>
            <strong id="dupModeText">DESATIVADO</strong>
          </button>
        </div>

        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar por jogador ou número (ex: BRA20, Estêvão, MEX1, FWC5)...">
        </div>

        <div class="filters-row">
          <button class="filter-chip active" data-filter="all">Todas</button>
          <button class="filter-chip" data-filter="missing">❌ Faltam</button>
          <button class="filter-chip" data-filter="owned">✅ Tenho</button>
          <button class="filter-chip" data-filter="duplicates">🔁 Repetidas</button>
          <button class="btn-expand-all" id="btnToggleExpandAll">Expandir Tudo</button>
        </div>
      </div>

      <!-- Lista de Janelas Expansíveis (Accordions) por Seleção -->
      <main class="accordion-list" id="accordionList">
        <!-- Renderizado via JS -->
      </main>
    </div>

    <!-- Modals -->
    <!-- Modal: Backup & Restauração -->
    <div class="modal-overlay" id="backupModal">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 class="modal-title">💾 Backup & Restauração de Dados</h3>
          <button class="btn-close">&times;</button>
        </div>
        <p style="font-size: 0.82rem; color: var(--text-muted);">
          Seus dados de figurinhas marcadas e repetidas são <strong>salvos automaticamente</strong> no seu dispositivo.
        </p>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="btn-primary" id="btnDownloadBackup" style="background: linear-gradient(135deg, #10B981, #059669); color: white;">
            💾 Baixar Backup Geral (.json)
          </button>
          
          <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">Restaurar backup salvo anteriormente:</p>
            <input type="file" id="inputRestoreBackup" accept=".json" style="display: none;">
            <button class="btn-primary" id="btnTriggerRestore" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--text-main);">
              📥 Importar Arquivo de Backup (.json)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Exportar Faltantes e Repetidas -->
    <div class="modal-overlay" id="exportModal">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 class="modal-title" id="exportModalTitle">📋 Exportar Figurinhas</h3>
          <button class="btn-close">&times;</button>
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 6px;">
          <button class="filter-chip active" id="tabExportMissing" style="flex: 1; text-align: center;">❌ Faltantes</button>
          <button class="filter-chip" id="tabExportDuplicates" style="flex: 1; text-align: center;">🔁 Repetidas</button>
        </div>
        <textarea id="exportTextarea" class="textarea-box" readonly style="min-height: 180px; font-family: monospace; font-size: 0.8rem;"></textarea>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn-primary" id="btnCopyExport" style="flex: 1;">📋 Copiar Lista</button>
          <button class="btn-primary" id="btnDownloadExport" style="flex: 1; background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: white;">💾 Baixar (.txt)</button>
        </div>
      </div>
    </div>


    <!-- Modal: Cadastrar Novo Jogador/Cromo -->
    <div class="modal-overlay" id="customModal">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 class="modal-title">⚽ Adicionar Figurinha</h3>
          <button class="btn-close">&times;</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <input type="text" id="customNum" class="search-input" placeholder="Número do Cromo (Ex: BRA21 ou FWC30)">
          <input type="text" id="customName" class="search-input" placeholder="Nome do Atleta (Ex: Savinho)">
          <input type="text" id="customSec" class="search-input" placeholder="Seleção (Ex: Brasil)">
        </div>
        <button class="btn-primary" id="btnSaveCustom">💾 Salvar Figurinha</button>
      </div>
    </div>

  </div>

  <script type="module" src="app.js?v=21.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.error('Erro ao registrar service worker:', error);
        });
      });
    }
  </script>
</body>
</html>
